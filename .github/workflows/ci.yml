name: checks
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: pip install numpy matplotlib pytest ruff
      - name: Lint (syntax errors and undefined names)
        run: ruff check --select E9,F63,F7,F82 .
      - name: Runtime tests
        run: python -m pytest -q tests
      - name: Benchmark regenerates byte for byte
        run: python src/obligationbench/construction/reproduce_corpus.py
      - name: Tables from the logs
        run: |
          tar -xzf data/episode_logs/prime-episode-logs.tar.gz
          python experiments/reproduce_tables.py
          python experiments/analysis/regenerate_tables.py
      - name: Conformance on the logged episodes
        run: python -m pytest -q tests/test_obligationbench_conformance.py
      - name: Figures
        env:
          MPLBACKEND: Agg
        run: |
          python experiments/paper/make_figures.py
          python experiments/paper/make_fig_budget.py
          python experiments/paper/make_appendix_figures.py
